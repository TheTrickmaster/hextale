<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hextale — Page not found</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   404 — LA PAGINA CHE NON C'E'
   ═══════════════════════════════════════════════════════════════════════════
   Sta alla radice del sito e si chiama 404.html perche' e' il nome che GitHub
   Pages cerca da solo quando un indirizzo non porta da nessuna parte: non c'e'
   niente da configurare, basta che il file stia li'.

   TUTTI GLI INDIRIZZI QUI DENTRO PARTONO DALLA RADICE ("/fonts/…", "/ui/…").
   Non e' pignoleria: questa pagina viene servita SOTTO l'indirizzo sbagliato
   che l'ha chiamata — /play/roba/inesistente resta l'indirizzo nella barra —
   e un percorso relativo cercherebbe i font dentro a una cartella che non
   esiste. Con la barra davanti l'indirizzo e' sempre lo stesso, qualunque sia
   la porta da cui si e' entrati.

   Non e' il gioco: e' una pagina sola, senza il caricatore di risorse e senza
   il motore che veste i pulsanti. Per questo i disegni del pulsante stanno
   scritti a mano nel CSS invece di arrivare da uiFileCandidati(), ed e' una
   scelta: tirarsi dietro quella macchina per un pulsante solo costerebbe piu'
   di quanto valga. Il vestito pero' e' identico e viene dallo stesso posto
   (/ui/button-opaque-*), quindi il giorno in cui l'arte cambia cambia anche
   qui, senza che nessuno debba ricordarsene. */
@font-face{
  font-family:'Rosarivo';
  src:url('/fonts/Rosarivo-Regular.ttf') format('truetype');
  font-weight:normal; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Rosarivo';
  src:url('/fonts/Rosarivo-Italic.ttf') format('truetype');
  font-weight:normal; font-style:italic; font-display:swap;
}
@font-face{
  font-family:'Marcellus SC';
  src:url('/fonts/MarcellusSC-Regular.ttf') format('truetype');
  font-weight:normal; font-style:normal; font-display:swap;
}
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --cursore:url('/ui/cursor.png') 2 2, pointer;
  --cursore-premuto:url('/ui/cursor-click.png') 2 2, pointer;
}
html, body{ height:100%; }
body{
  /* Il fondale copre la finestra e non si stira: "cover" ritaglia invece di
     deformare. Il colore sotto e' il piu' scuro dell'immagine, cosi' il primo
     istante — prima che il fondale arrivi — non e' un lampo bianco. */
  background:#0C1012 url('/web-assets/404-bg.jpg') center / cover no-repeat fixed;
  color:#EDE0C6;
  cursor:var(--cursore);
  /* Un blocco solo, in mezzo alla finestra nei due versi. "min-height" e non
     "height": se un giorno il blocco diventasse piu' alto dello schermo la
     pagina scorrerebbe, invece di tagliarlo. */
  min-height:100%;
  display:flex; align-items:center; justify-content:center;
  padding:60px 24px;
  -webkit-font-smoothing:antialiased;
}
body.mouse-down{ cursor:var(--cursore-premuto); }

/* ── LA COLONNA ───────────────────────────────────────────────────────────
   Le distanze le detta l'elemento che sta SOPRA, con un margine sotto. E'
   l'unico modo perche' i tre stacchi da 100px restino tre numeri leggibili:
   un "gap" solo sul contenitore darebbe la stessa distanza a tutti e sei gli
   elementi, e i 16px fra il "404" e "Page not found" sono un'altra cosa —
   quei due sono una cosa sola, non due cose vicine. */
.quattroquattro{
  display:flex; flex-direction:column; align-items:center;
  text-align:center;
}
.q-logo{ display:block; height:130px; width:auto; margin-bottom:100px; }
.q-404{ display:block; width:352px; max-width:100%; height:auto; margin-bottom:16px; }
.q-perduta{
  font-family:'Rosarivo',serif; font-size:36px; font-weight:400; line-height:1.2;
  color:#748386;
  margin-bottom:100px;
}
.q-battuta{
  font-family:'Marcellus SC',serif;
  font-size:40px; font-weight:400; line-height:1.2;
  color:#EDE0C6;
}
.q-postilla{
  font-family:'Rosarivo',serif; font-size:24px; font-weight:400; line-height:1.3;
  color:#EDE0C6;
  margin-top:12px;
  margin-bottom:100px;
}

/* ── IL PULSANTE ──────────────────────────────────────────────────────────
   E' la famiglia .hx-btn del gioco, versione opaca, copiata pezzo per pezzo.
   Cinque immagini in fila dietro all'etichetta: due tappi da 49px, un centro
   da 58, e due riempitivi che si prendono quel che avanza. L'etichetta sta nel
   flusso normale ed e' lei a dare la larghezza; la striscia e' uno strato
   assoluto dietro, che si adatta. Il verso opposto sarebbe un cane che si
   morde la coda — la larghezza dei riempitivi dipenderebbe da quella del
   pulsante, che dipende dall'etichetta, che sta dentro ai pezzi.
   I 200px di minimo non sono estetica: sotto i 156px di pezzi fissi i
   riempitivi non hanno piu' niente da riempire e le tre immagini finiscono
   attaccate. Duecento e' la misura piu' stretta in cui la cornice si legge
   intera. */
.hx-btn{
  --hxb-h:68px;
  --hxb-cap-w:49px; --hxb-mid-w:58px;
  position:relative; flex:0 0 auto;
  height:var(--hxb-h);
  min-width:200px; max-width:400px;
  display:inline-flex; align-items:center; justify-content:center;
  padding:0 34px;
  background:none; border:0; margin:0;
  text-decoration:none;
  cursor:var(--cursore);
  transition:filter 0.16s ease, transform 0.16s ease;
}
.hx-btn .hxb-strip{
  position:absolute; inset:0; z-index:0;
  display:flex; align-items:stretch;
  pointer-events:none;
}
/* Le testate e il centro tengono la loro misura intera; i due riempitivi si
   dividono quello che avanza, frazione di pixel compresa. Il mezzo pixel su
   cui cade un bordo lascerebbe una righina di fondale fra un pezzo e l'altro:
   qui si accavallano di uno, e si puo' fare perche' l'arte opaca e' piena
   (alfa 254-255). Su quella trasparente due strati sommerebbero la loro
   opacita' e la giuntura verrebbe piu' scura della zona accanto: il rimedio
   si vedrebbe quanto il difetto. */
.hx-btn .hxb-strip > span{
  background-repeat:no-repeat; background-size:100% 100%;
  margin-right:-1px;
}
.hx-btn .hxb-strip > span:last-child{ margin-right:0; }
.hx-btn .hxb-left, .hx-btn .hxb-right{ flex:0 0 var(--hxb-cap-w); }
.hx-btn .hxb-center{ flex:0 0 var(--hxb-mid-w); }
/* Il riempitivo e' una fetta larga 2px: si ripete invece di stirarsi, cosi' la
   trama resta della sua densita' su un pulsante lungo come su uno corto. */
.hx-btn .hxb-strip > .hxb-fill{
  flex:1 1 0; min-width:0;
  background-repeat:repeat-x; background-size:auto 100%;
}
.hx-btn .hxb-left  { background-image:url('/ui/button-opaque-left.png'); }
.hx-btn .hxb-center{ background-image:url('/ui/button-opaque-center.png'); }
.hx-btn .hxb-right { background-image:url('/ui/button-opaque-right.png'); }
.hx-btn .hxb-fill  { background-image:url('/ui/button-opaque-filler.png'); }
.hx-btn .hxb-label{
  position:relative; z-index:1;
  display:inline-flex; align-items:center; gap:10px;
  font-family:'Marcellus SC',serif;
  font-size:22px; font-weight:400; line-height:1;
  color:#DDCAA1; white-space:nowrap;
}
.hx-btn:hover{ filter:brightness(1.18); }
.hx-btn:active{ transform:scale(0.98); }

/* ── SCHERMI STRETTI ──────────────────────────────────────────────────────
   Un telefono non ha 100px da regalare tre volte, e il "404" da 352px non ci
   sta. Cala tutto in proporzione: restano tre stacchi grandi e uno piccolo,
   che e' il ritmo che conta. */
@media (max-width:640px){
  .q-logo{ height:76px; margin-bottom:56px; }
  .q-404{ width:240px; }
  .q-perduta{ font-size:26px; margin-bottom:56px; }
  .q-battuta{ font-size:28px; }
  .q-postilla{ font-size:18px; margin-bottom:56px; }
}
</style>
</head>
<body>
  <main class="quattroquattro">
    <img class="q-logo" src="/web-assets/hextale-logo-topbar.png" alt="Hextale">
    <img class="q-404" src="/web-assets/404.png" alt="404">
    <p class="q-perduta">Page not found</p>
    <p class="q-battuta">Help! Robin Hood stole our page!</p>
    <p class="q-postilla">(We&rsquo;re not rich.)</p>
    <a class="hx-btn hx-btn-opaco" href="/">
      <span class="hxb-strip"><span class="hxb-left"></span><span class="hxb-fill"></span><span class="hxb-center"></span><span class="hxb-fill"></span><span class="hxb-right"></span></span>
      <span class="hxb-label">Back to homepage</span>
    </a>
  </main>
<script>
// Il cursore "premuto" e' la seconda faccia dello stesso disegno, come nel
// gioco. Lo stato sta sul body e non sull'elemento premuto: il tasto puo'
// essere lasciato altrove, e li' resterebbe acceso per sempre.
document.addEventListener('mousedown',  function(){ document.body.classList.add('mouse-down'); });
document.addEventListener('mouseup',    function(){ document.body.classList.remove('mouse-down'); });
document.addEventListener('mouseleave', function(){ document.body.classList.remove('mouse-down'); });
</script>
</body>
</html>
