<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hextale — Page not found</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>

@font-face{
  font-family:'Rosarivo';
  src:url('/fonts/Rosarivo-Regular.ttf') format('truetype');
  font-weight:normal; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Rosarivo';
  src:url('/fonts/Rosarivo-Italic.ttf') format('truetype');
  font-weight:normal; font-style:italic; font-display:swap;
}
@font-face{
  font-family:'Marcellus SC';
  src:url('/fonts/MarcellusSC-Regular.ttf') format('truetype');
  font-weight:normal; font-style:normal; font-display:swap;
}
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --cursore:url('/ui/cursor.png') 2 2, pointer;
  --cursore-premuto:url('/ui/cursor-click.png') 2 2, pointer;
}
html, body{ height:100%; }
body{

  background:#0C1012 url('/web-assets/404-bg.jpg') center / cover no-repeat fixed;
  color:#EDE0C6;
  cursor:var(--cursore);

  min-height:100%;
  display:flex; align-items:center; justify-content:center;
  padding:60px 24px;
  -webkit-font-smoothing:antialiased;
}
body.mouse-down{ cursor:var(--cursore-premuto); }


.quattroquattro{
  display:flex; flex-direction:column; align-items:center;
  text-align:center;
}
.q-logo{ display:block; height:130px; width:auto; margin-bottom:100px; }
.q-404{ display:block; width:352px; max-width:100%; height:auto; margin-bottom:16px; }
.q-perduta{
  font-family:'Rosarivo',serif; font-size:36px; font-weight:400; line-height:1.2;
  color:#748386;
  margin-bottom:100px;
}
.q-battuta{
  font-family:'Marcellus SC',serif;
  font-size:40px; font-weight:400; line-height:1.2;
  color:#EDE0C6;
}
.q-postilla{
  font-family:'Rosarivo',serif; font-size:24px; font-weight:400; line-height:1.3;
  color:#EDE0C6;
  margin-top:12px;
  margin-bottom:100px;
}


.hx-btn{
  --hxb-h:68px;
  position:relative; flex:0 0 auto;
  height:var(--hxb-h);
  min-width:200px; max-width:400px;
  display:inline-flex; align-items:center; justify-content:center;
  padding:0 34px;
  background:none; border:0; margin:0;
  text-decoration:none;
  cursor:var(--cursore);
  transition:filter 0.16s ease, transform 0.16s ease;
}
/* v0.82.3 — the game's one-piece button (ui/buttons), 264x69: the five pieces are gone */
.hx-btn{ width:264px; height:69px; padding:0 30px; box-sizing:border-box;
  background:url('/ui/buttons/button-default.png') center / 100% auto no-repeat; }
/* v0.82.3 — the label as in the game */
.hx-btn .hxb-label{
  font-family:'Marcellus SC','Marcellus',Georgia,serif; font-weight:400; font-size:26px; line-height:1; white-space:nowrap;
  background:linear-gradient(90deg, #F5B754 0%, #F6E0BB 50%, #F5BD54 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent !important;
  filter:url(#hx-btn-label);
}
.hx-btn .hxb-label{ position:relative; z-index:1; display:inline-flex; align-items:center; gap:10px; }
.hx-btn:hover{ filter:brightness(1.18); }
.hx-btn:active{ transform:scale(0.98); }


@media (max-width:640px){
  .q-logo{ height:76px; margin-bottom:56px; }
  .q-404{ width:240px; }
  .q-perduta{ font-size:26px; margin-bottom:56px; }
  .q-battuta{ font-size:28px; }
  .q-postilla{ font-size:18px; margin-bottom:56px; }
}
</style>
</head>
<body>
<!-- v0.82.3 — the game's button label (stroke and shadows), see #hx-btn-label in the game -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><filter id="hx-btn-label" x="-20%" y="-40%" width="140%" height="200%" color-interpolation-filters="sRGB">
    <feComponentTransfer in="SourceAlpha" result="outside"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
    <feOffset in="outside" dx="1" dy="1"/>
    <feGaussianBlur stdDeviation="0.85" result="lightBlur"/>
    <feFlood flood-color="#FFFFFF"/>
    <feComposite operator="in" in2="lightBlur"/>
    <feComposite operator="in" in2="SourceAlpha" result="light"/>
    <feBlend mode="soft-light" in="light" in2="SourceGraphic" result="lit"/>
    <feOffset in="outside" dx="-1" dy="-1"/>
    <feGaussianBlur stdDeviation="0.85" result="darkBlur"/>
    <feFlood flood-color="#000000" flood-opacity="0.6"/>
    <feComposite operator="in" in2="darkBlur"/>
    <feComposite operator="in" in2="SourceAlpha" result="dark"/>
    <feBlend mode="soft-light" in="dark" in2="lit" result="filled"/>
    <feOffset in="SourceAlpha" dx="0.5" result="eR"/><feOffset in="SourceAlpha" dx="-0.5" result="eL"/>
    <feOffset in="SourceAlpha" dy="0.5" result="eD"/><feOffset in="SourceAlpha" dy="-0.5" result="eU"/>
    <feComposite operator="in" in="eR" in2="eL"/><feComposite operator="in" in2="eD"/><feComposite operator="in" in2="eU" result="shrunk"/>
    <feComposite in="SourceAlpha" in2="shrunk" operator="out" result="ring"/>
    <feFlood flood-color="#DDCBA3"/>
    <feComposite operator="in" in2="ring" result="stroke"/>
    <feMerge result="text"><feMergeNode in="filled"/><feMergeNode in="stroke"/></feMerge>
    <feOffset in="SourceAlpha" dy="0.53" result="edge1"/>
    <feOffset in="SourceAlpha" dy="1.06" result="edge2"/>
    <feMerge result="edges"><feMergeNode in="edge1"/><feMergeNode in="edge2"/></feMerge>
    <feFlood flood-color="#252D2F"/>
    <feComposite operator="in" in2="edges" result="edge"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
    <feOffset dy="2" result="low"/>
    <feFlood flood-color="#000000" flood-opacity="0.8"/>
    <feComposite operator="in" in2="low" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="edge"/><feMergeNode in="text"/></feMerge>
  </filter></defs></svg>
  <main class="quattroquattro">
    <img class="q-logo" src="/web-assets/hextale-logo-topbar.png" alt="Hextale">
    <img class="q-404" src="/web-assets/404.png" alt="404">
    <p class="q-perduta">Page not found</p>
    <p class="q-battuta">Help! Robin Hood stole our page!</p>
    <p class="q-postilla">(We&rsquo;re not rich.)</p>
    <a class="hx-btn hx-btn-opaco" href="/">
      <span class="hxb-label">Back to homepage</span>
    </a>
  </main>
<script>
document.addEventListener('mousedown',  function(){ document.body.classList.add('mouse-down'); });
document.addEventListener('mouseup',    function(){ document.body.classList.remove('mouse-down'); });
document.addEventListener('mouseleave', function(){ document.body.classList.remove('mouse-down'); });
</script>

<script>
// v0.82.3 — the one-piece buttons are 264 wide and never stretch: a label longer than
// the room between the two little arrows gets a smaller font until it fits (16 at least)
(function(){
  var SPAZIO = 264 - 2 * 38;
  function stringi(){
    [].forEach.call(document.querySelectorAll('.hx-btn .hxb-label'), function(e){
      e.style.fontSize = '';
      var px = parseFloat(getComputedStyle(e).fontSize) || 26;
      while(e.scrollWidth > SPAZIO && px > 16){ px -= 1; e.style.fontSize = px + 'px'; }
    });
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(stringi);
  window.addEventListener('load', stringi);
  window.addEventListener('resize', stringi);
})();
</script>
</body>
</html>
