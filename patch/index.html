<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hextale — Balance Changes</title>
<meta name="description" content="Every card change since version 0.80.48, card by card.">
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:title" content="Hextale — Balance Changes">
<meta property="og:description" content="A lot of cards went through a first round of heavy balancing. Here is every change, card by card.">
<meta property="og:image" content="https://hextalegame.com/web-assets/sito/header.png">
<meta property="og:url" content="https://hextalegame.com/patch/">
<style>
@font-face{
  font-family:'Marcellus SC';
  src:url('/fonts/MarcellusSC-Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Rosarivo';
  src:url('/fonts/Rosarivo-Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Rosarivo';
  src:url('/fonts/Rosarivo-Italic.ttf') format('truetype');
  font-weight:400; font-style:italic; font-display:swap;
}
:root{
  --oro:#EDE0C6;
  --oro-caldo:#FBEAC4;
  --oro-scritta:#E9D8B3;
  --grigio:#9FB1B3;
  --grigio-chiaro:#A3B2B4;
  --fondo:#1B2325;
  --bordo:#4E5455;
  --su:#7CD69A;
  --giu:#E88A7A;
  --molla:cubic-bezier(.22,1,.36,1);
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; overflow-x:clip; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *, *::before, *::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
body{
  background:var(--fondo);
  color:var(--oro);
  font-family:'Rosarivo',Georgia,serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#trama{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:url('/web-assets/sito/hextale-landing-page-desktop.png') top left repeat;
  background-size:1440px auto;
  mix-blend-mode:overlay; opacity:.58;
}
main{ position:relative; z-index:1; }
img{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
.dentro{ width:min(1240px, calc(100% - 48px)); margin:0 auto; }
.stretto{ width:min(787px, calc(100% - 48px)); margin:0 auto; }

.btn{
  --cap:49px; --mid:58px;
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  height:68px; min-width:200px; padding:0 34px;
  border:0; background:none;
  font-family:'Marcellus SC',Georgia,serif; font-size:22px; line-height:1;
  color:#DDCAA1; white-space:nowrap; cursor:pointer;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.3));
  transition:filter .18s ease, transform .18s ease;
}
.btn:hover{ filter:drop-shadow(0 2px 5px rgba(0,0,0,.3)) brightness(1.12); }
.btn:active{ transform:scale(.985); }
.btn:focus-visible{ outline:2px solid var(--oro-caldo); outline-offset:4px; }
.btn .pezzi{ position:absolute; inset:0; z-index:0; display:flex; align-items:stretch; pointer-events:none; }
.btn .pezzi > span{ background-repeat:no-repeat; background-size:100% 100%; margin-right:-1px; }
.btn .pezzi > span:last-child{ margin-right:0; }
.btn .cap-sx, .btn .cap-dx{ flex:0 0 var(--cap); }
.btn .mezzo{ flex:0 0 var(--mid); }
.btn .fill{ flex:1 1 0; min-width:0; background-repeat:repeat-x; background-size:auto 100%; }
.btn .etichetta{ position:relative; z-index:1; }
.btn.important{ --cap:49px; --mid:47px; color:#322C1D; }
.btn.important .cap-sx{ background-image:url('/ui/button-important-left.png'); }
.btn.important .mezzo { background-image:url('/ui/button-important-center.png'); }
.btn.important .cap-dx{ background-image:url('/ui/button-important-right.png'); }
.btn.important .fill  { background-image:url('/ui/button-important-filler.png'); }

#barra{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 14px;
  transition:background .3s ease, padding .3s ease, backdrop-filter .3s ease;
}
#barra.staccata{
  padding:10px 14px;
  background:rgba(17,23,24,.72);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  box-shadow:0 1px 0 rgba(255,255,255,.06);
}
#barra .marchio-piccolo{ width:64px; height:68px; }
#barra .marchio-piccolo img{ width:100%; height:100%; object-fit:contain; }

.titolo{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  height:124px; padding:0 20px;
  border-style:solid; border-width:0 63px;
  border-image-source:url('/cards/card-parts/name-wrapper-timeless.png');
  border-image-slice:0 92 fill;
  border-image-repeat:stretch;
  font-family:'Marcellus SC',Georgia,serif; font-weight:400;
  font-size:32px; line-height:43px;
  background:linear-gradient(115deg, #E6CA8E 23.78%, #FFF5E4 50.28%, #E6CA8E 81.04%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  white-space:nowrap;
}
.occhiello{ font-family:'Marcellus SC',Georgia,serif; font-size:24px; line-height:27px; color:var(--grigio-chiaro); text-shadow:0 0 4.1px #120B07; }
.corpo{ font-size:18px; line-height:1.35; color:var(--oro-caldo); text-shadow:0 0 4.1px #120B07; }
.riga{ width:242px; height:1px; margin:0 auto; background:linear-gradient(90deg, transparent, rgba(237,224,198,.45), transparent); }

#testa{ padding:150px 0 40px; text-align:center; }
#testa .occhiello{ margin-bottom:14px; }
#testa .riga{ margin:26px auto; }
#testa .corpo{ max-width:620px; margin:0 auto; }
#testa .numeri{
  display:flex; justify-content:center; flex-wrap:wrap; gap:10px 28px; margin-top:26px;
  font-family:'Marcellus SC',Georgia,serif; font-size:17px; color:var(--grigio-chiaro);
}
#testa .numeri b{ font-weight:400; color:var(--oro-caldo); font-size:22px; margin-right:6px; font-variant-numeric:tabular-nums; }

#filtri{
  position:sticky; top:96px; z-index:5;
  display:flex; justify-content:center; flex-wrap:wrap; gap:8px;
  margin:10px auto 34px; padding:0 12px;
}
#filtri button{
  font-family:'Marcellus SC',Georgia,serif; font-size:17px; line-height:1;
  color:var(--grigio-chiaro);
  padding:11px 18px; border-radius:999px;
  border:1px solid var(--bordo);
  background:rgba(24,36,38,.72);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  cursor:pointer;
  transition:color .18s ease, border-color .18s ease, background .18s ease;
}
#filtri button:hover{ color:var(--oro-caldo); border-color:#7A7361; }
#filtri button[aria-pressed="true"]{ color:#322C1D; background:linear-gradient(115deg, #E6CA8E, #FFF5E4 50%, #E6CA8E); border-color:#E6CA8E; }
#filtri button:focus-visible{ outline:2px solid var(--oro-caldo); outline-offset:3px; }
#filtri button .n{ font-variant-numeric:tabular-nums; opacity:.75; margin-left:6px; }

#elenco{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:18px; align-items:start;
  padding-bottom:90px;
}
.scheda{
  border:1px solid var(--bordo); border-radius:16px;
  background-image:linear-gradient(90deg, rgba(37,32,29,.53) 0%, rgba(87,77,72,0) 100%),
                   linear-gradient(90deg, rgba(24,36,38,.5) 0%, rgba(24,36,38,.5) 100%);
  -webkit-backdrop-filter:blur(15px); backdrop-filter:blur(15px);
  box-shadow:0 2px 10px rgba(0,0,0,.3);
  padding:18px 18px 20px;
  display:flex; flex-direction:column; gap:14px;
}
.scheda[hidden]{ display:none; }
.scheda .capo{ display:flex; align-items:center; gap:14px; }
.esagono{
  flex:0 0 auto; width:62px; height:70px; position:relative;
  clip-path:polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  background:var(--rarita, #fff);
}
.esagono img{
  position:absolute; inset:2px; width:calc(100% - 4px); height:calc(100% - 4px); object-fit:cover;
  clip-path:polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
}
.scheda h2{ font-family:'Marcellus SC',Georgia,serif; font-weight:400; font-size:23px; line-height:1.15; color:var(--oro-caldo); }
.scheda .rarita{ font-family:'Marcellus SC',Georgia,serif; font-size:14px; letter-spacing:.06em; color:var(--rarita, #fff); margin-top:3px; }
.voce{ border-top:1px solid rgba(237,224,198,.1); padding-top:12px; }
.voce .etichetta{
  font-family:'Marcellus SC',Georgia,serif; font-size:14px; letter-spacing:.06em;
  color:var(--grigio); margin-bottom:8px; text-transform:uppercase;
}
.potere{ display:flex; align-items:center; gap:10px; }
.potere svg{ width:112px; height:112px; flex:0 0 auto; }
.potere .freccia{ font-family:'Marcellus SC',Georgia,serif; font-size:24px; color:var(--grigio); }
.voce .nota{ font-size:15px; line-height:1.3; color:var(--grigio-chiaro); margin-top:6px; font-variant-numeric:tabular-nums; }
.voce .nota .somma{ margin-left:8px; }
.voce .nota .su{ color:var(--su); }
.voce .nota .giu{ color:var(--giu); }
.hex-bordo{ fill:rgba(12,16,18,.55); stroke:rgba(237,224,198,.35); stroke-width:1.5; }
.hex-num{ font-family:'Marcellus SC',Georgia,serif; font-size:17px; fill:var(--oro); text-anchor:middle; dominant-baseline:central; font-variant-numeric:tabular-nums; }
.hex-num.su{ fill:var(--su); }
.hex-num.giu{ fill:var(--giu); }
.hex-num.mosso{ fill:#F2D38A; }
.testo-abilita{ font-size:16px; line-height:1.35; color:var(--oro-caldo); }
.testo-abilita.prima{ color:var(--grigio); font-size:15px; margin-bottom:8px; }
.testo-abilita.prima::before{ content:'Before: '; font-family:'Marcellus SC',Georgia,serif; font-size:13px; letter-spacing:.05em; color:#6E7F82; }
.testo-abilita.ora::before{ content:'Now: '; font-family:'Marcellus SC',Georgia,serif; font-size:13px; letter-spacing:.05em; color:var(--grigio-chiaro); }
.testo-abilita b{ font-weight:400; color:#FFFFFF; }
.testo-abilita i{ font-style:italic; color:#F2D38A; }
.nome-abilita{ font-family:'Marcellus SC',Georgia,serif; font-size:17px; color:#F2D38A; margin-bottom:6px; }
.tratti{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; font-size:15px; color:var(--grigio-chiaro); }
.tratto{ display:inline-flex; align-items:center; gap:5px; color:var(--oro-caldo); font-family:'Marcellus SC',Georgia,serif; font-size:15px; }
.tratto img{ width:20px; height:20px; object-fit:contain; }
.tratto.via{ color:var(--giu); text-decoration:line-through; text-decoration-thickness:1px; }
.tratto.nuovo{ color:var(--su); }
.comportamento{ font-size:15px; line-height:1.35; color:var(--oro-caldo); }

footer{ position:relative; background:#0D1415; padding:40px 60px; z-index:1; }
footer::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:url('/web-assets/sito/hextale-landing-page-desktop.png') top left / 1440px auto repeat;
  mix-blend-mode:overlay; opacity:.58; filter:grayscale(1);
}
footer .dentro{ position:relative; width:auto; margin:0; display:flex; align-items:center; justify-content:space-between; gap:24px; }
footer .logo-studio{
  flex:0 0 auto; display:block; width:149px; height:88px; background:#525E61;
  -webkit-mask:url('/loading-screen/big-fennel-logo.png') center / contain no-repeat;
          mask:url('/loading-screen/big-fennel-logo.png') center / contain no-repeat;
}
footer .legali{ display:flex; align-items:center; justify-content:center; gap:24px; }
footer .legali a{ font-size:12px; line-height:1.2; color:#568992; white-space:nowrap; text-decoration:underline; text-underline-position:from-font; transition:color .18s ease; }
footer .legali a:hover{ color:#7FB3BC; }
footer .social{ display:flex; align-items:center; gap:16px; }
footer .social a{ display:block; line-height:0; transition:transform .18s var(--molla), filter .18s ease; }
footer .social a:hover{ transform:translateY(-2px); filter:brightness(1.15); }

@media (max-width:980px){
  .btn{ font-size:19px; height:60px; min-width:180px; padding:0 22px; --cap:43px; --mid:51px; }
  #barra .marchio-piccolo{ width:48px; height:52px; }
  #barra{ background:rgba(17,23,24,.72); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); padding:10px 14px; }
  #testa{ padding:110px 0 30px; }
  .titolo{ font-size:22px; height:88px; border-width:0 45px; padding:0 12px; }
  .occhiello{ font-size:19px; line-height:1.2; }
  .corpo{ font-size:16px; }
  #filtri{ top:72px; }
  #elenco{ grid-template-columns:1fr; }
  footer{ padding:40px 24px; }
  footer .dentro{ flex-direction:column; gap:30px; }
  footer .legali{ flex-wrap:wrap; row-gap:12px; }
}
@media (max-width:420px){
  .potere svg{ width:96px; height:96px; }
  .potere{ flex-wrap:wrap; }
}
</style>
</head>

    </div>
  </div>
</footer>

  var RARITA = { common:'#ffffff', rare:'#0CB9CD', mythic:'#C33CCF', timeless:'#FF8000' };

  var LATI = ['NW','NE','E','SE','SW','W'];
  var ANGOLI = { NW:-120, NE:-60, E:0, SE:60, SW:120, W:180 };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function testoAbilita(s){
    return esc(s).replace(/\/([^\/]+)\//g, '<i>$1</i>').replace(/\*([^*]+)\*/g, '<b>$1</b>');
  }
  function esagono(valori, prima, modo){
    var c = 60, r = 52, p = [];
    for(var i = 0; i < 6; i++){
      var a = (-90 + 60 * i) * Math.PI / 180;
      p.push((c + r * Math.cos(a)).toFixed(1) + ',' + (c + r * Math.sin(a)).toFixed(1));
    }
    var s = '<svg viewBox="0 0 120 120" role="img" aria-label="' + esc(LATI.map(function(l, i){ return l + ' ' + valori[i]; }).join(', ')) + '">';
    s += '<polygon class="hex-bordo" points="' + p.join(' ') + '"/>';
    for(var j = 0; j < 6; j++){
      var l = LATI[j], ang = ANGOLI[l] * Math.PI / 180;
      var x = c + 33 * Math.cos(ang), y = c + 33 * Math.sin(ang);
      var cl = 'hex-num';
      if(prima){
        if(modo === 'riordino'){ if(prima[j] !== valori[j]) cl += ' mosso'; }
        else if(valori[j] > prima[j]) cl += ' su';
        else if(valori[j] < prima[j]) cl += ' giu';
      }
      s += '<text class="' + cl + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '">' + valori[j] + '</text>';
    }
    return s + '</svg>';
  }

  function tratto(nome, classe){
    var chiave = String(nome).toLowerCase();

    var g = {};
    v.cambi.forEach(function(x){
      if(x.tipo === 'valori' || x.tipo === 'riordino') g.potere = true;
      if(x.tipo === 'abilita' || x.tipo === 'nome' || x.tipo === 'comportamento') g.abilita = true;
      if(x.tipo === 'tratti') g.tratti = true;
      if(x.tipo === 'nuova') g.nuove = true;
    });
    return g;
  }
  function voce(v, x){
    if(x.tipo === 'valori' || x.tipo === 'riordino'){
      var d = somma(x.a) - somma(x.da);
      var nota = x.tipo === 'riordino'
        ? 'Same values, turned to face new sides.'
        : 'Total Power ' + somma(x.da) + ' → ' + somma(x.a)
          + ' <span class="somma">' + (d === 0 ? 'Same total, new spread.' : '<span class="' + (d > 0 ? 'su' : 'giu') + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</span> overall') + '</span>';
      return '<div class="voce"><div class="etichetta">' + (x.tipo === 'riordino' ? 'Power rearranged' : 'Power') + '</div>'
        + '<div class="potere">' + esagono(x.da) + '<span class="freccia" aria-hidden="true">→</span>' + esagono(x.a, x.da, x.tipo) + '</div>'
        + '<p class="nota">' + nota + '</p></div>';
    }
    if(x.tipo === 'abilita'){
      return '<div class="voce"><div class="etichetta">Ability</div>'
        + (v.abilitaNome ? '<div class="nome-abilita">' + esc(v.abilitaNome) + '</div>' : '')
        + (x.da ? '<p class="testo-abilita prima">' + testoAbilita(x.da) + '</p>' : '')
        + '<p class="testo-abilita ora">' + testoAbilita(x.a) + '</p></div>';
    }
    if(x.tipo === 'nome'){
      return '<div class="voce"><div class="etichetta">Ability name</div>'
        + '<p class="testo-abilita">' + (x.da ? esc(x.da) + ' → ' : '') + '<b>' + esc(x.a) + '</b></p></div>';
    }
    if(x.tipo === 'tratti'){
      var via = x.da.filter(function(t){ return x.a.indexOf(t) < 0; });
      var nuovi = x.a.filter(function(t){ return x.da.indexOf(t) < 0; });
      var resta = x.a.filter(function(t){ return x.da.indexOf(t) >= 0; });
      return '<div class="voce"><div class="etichetta">Traits</div><div class="tratti">'
        + resta.map(function(t){ return tratto(t); }).join('')
        + via.map(function(t){ return tratto(t, 'via'); }).join('')
        + nuovi.map(function(t){ return tratto(t, 'nuovo'); }).join('')
        + '</div></div>';
    }
    if(x.tipo === 'nuova'){
      return '<div class="voce"><div class="etichetta">New card</div>'
        + (x.valori && x.valori.length === 6 ? '<div class="potere">' + esagono(x.valori) + '</div><p class="nota">Total Power ' + somma(x.valori) + '</p>' : '')
        + (x.tratti && x.tratti.length ? '<div class="tratti">' + x.tratti.map(function(t){ return tratto(t); }).join('') + '</div>' : '')
        + (x.abilita ? '<div class="nome-abilita nuova-abilita">' + esc(x.abilita) + '</div>' : '')
        + (x.descrizione ? '<p class="testo-abilita">' + testoAbilita(x.descrizione) + '</p>' : '')
        + '</div>';
    }
    if(x.tipo === 'comportamento'){
      return '<div class="voce"><div class="etichetta">Ability fix</div><p class="comportamento">' + esc(x.testo) + '</p></div>';
    }
    return '';
  }
  function ordine(x){ var o = { nuova:-1, valori:0, riordino:0, nome:1, abilita:2, comportamento:3, tratti:4 }[x.tipo]; return o === undefined ? 9 : o; }

  var elenco = document.getElementById('elenco');
  var conta = { tutte:0, nuove:0, potere:0, abilita:0, tratti:0 };
  elenco.innerHTML = CARTE.map(function(v){
    var g = gruppi(v);
    conta.tutte++;
    if(g.nuove) conta.nuove++;
    if(g.potere) conta.potere++;
    if(g.abilita) conta.abilita++;
    if(g.tratti) conta.tratti++;
    var colore = RARITA[v.rarita] || RARITA.common;
    var cambi = v.cambi.slice().sort(function(a, b){ return ordine(a) - ordine(b); });
    return '<article class="scheda" style="--rarita:' + colore + '" data-gruppi="' + Object.keys(g).join(' ') + '">'
      + '<div class="capo"><div class="esagono">' + (v.arte ? '<img src="' + esc(v.arte) + '" alt="" loading="lazy" decoding="async">' : '') + '</div>'
      + '<div><h2>' + esc(v.nome) + '</h2><div class="rarita">' + esc(NOMI_RARITA[v.rarita] || v.rarita) + '</div></div></div>'
      + cambi.map(function(x){ return voce(v, x); }).join('')
      + '</article>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('[data-n]'), function(el){ el.textContent = conta[el.getAttribute('data-n')]; });
  document.getElementById('numeri').innerHTML =
      '<span><b>' + conta.tutte + '</b>cards changed</span>'
    + (conta.nuove ? '<span><b>' + conta.nuove + '</b>new cards</span>' : '')
    + '<span><b>' + conta.potere + '</b>with new Power</span>'
    + '<span><b>' + conta.abilita + '</b>with ability changes</span>'
    + '<span><b>' + conta.tratti + '</b>with new traits</span>';

  var bottoni = document.querySelectorAll('#filtri button');
  Array.prototype.forEach.call(bottoni, function(b){
    b.addEventListener('click', function(){
      var f = b.getAttribute('data-filtro');
      Array.prototype.forEach.call(bottoni, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      Array.prototype.forEach.call(elenco.children, function(s){
        s.hidden = !(f === 'tutte' || (' ' + s.getAttribute('data-gruppi') + ' ').indexOf(' ' + f + ' ') >= 0);
      });
    });
  });

  var barra = document.getElementById('barra');
  function scorri(){ barra.classList.toggle('staccata', (window.pageYOffset || document.documentElement.scrollTop) > 40); }
  window.addEventListener('scroll', scorri, { passive:true });
  scorri();
})();
</script>
<script defer src="/scarica-app.js"></script>
</body>
</html>
