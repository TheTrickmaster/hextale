</head>

<body>

<div id="status">Loading Hextale...</div>

<script>
    const OWNER = "TheTrickmaster";
    const REPO = "hextale";
    const BRANCH = "main";

    // GitHub REST API endpoint for the repository root
    const API_URL =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`;

    async function redirectToLatestVersion() {
        const status = document.getElementById("status");

        try {
            status.textContent = "Finding latest version...";

            const response = await fetch(API_URL, {
                method: "GET",
                headers: {
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2026-03-10"
                },
                cache: "no-store"
            });

            if (!response.ok) {
                let errorMessage = `HTTP ${response.status}`;

                try {
                    const errorData = await response.json();

                    if (errorData.message) {
                        errorMessage += `: ${errorData.message}`;
                    }
                } catch {
                    // Ignore JSON parsing errors
                }

                throw new Error(errorMessage);
            }

            const files = await response.json();

            // Match:
            // Hextale_0.77.51.html
            // Hextale_0.78.0.html
            // Hextale_1.0.0.html
            const versionRegex = /^Hextale_(\d+)\.(\d+)\.(\d+)\.html$/i;

            const versions = files
                .filter(file => file.type === "file")
                .map(file => {
                    const match = file.name.match(versionRegex);

                    if (!match) {
                        return null;
                    }

                    return {
                        name: file.name,
                        major: Number(match[1]),
                        minor: Number(match[2]),
                        patch: Number(match[3])
                    };
                })
                .filter(Boolean);

            if (versions.length === 0) {
                throw new Error(
                    "No Hextale version files were found in the repository root."
                );
            }

            // Sort highest version first
            versions.sort((a, b) => {
                if (a.major !== b.major) {
                    return b.major - a.major;
                }

                if (a.minor !== b.minor) {
                    return b.minor - a.minor;
                }

                return b.patch - a.patch;
            });

            const latest = versions[0];

            status.textContent = `Loading ${latest.name}...`;

            // Redirect to the HTML file in the same GitHub Pages site
            window.location.replace(`./${latest.name}`);

        } catch (error) {
            console.error("Hextale loading error:", error);

            status.innerHTML = `
                <div>
                    <strong>Unable to load Hextale</strong>
                    <br><br>
                    <small>${escapeHtml(error.message)}</small>
                </div>
            `;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    redirectToLatestVersion();
</script>

</body>
</html>
