# Da incollare dentro a /opt/nakama/docker-compose.yml, sotto a `services:`,
# con la stessa indentazione degli altri servizi.
#
# Nakama la raggiunge come http://posta:8081 — il nome del servizio E' il nome
# di rete. Nessuna porta esposta verso l'esterno: da fuori questo servizio non
# deve esistere.
  posta:
    build: /opt/nakama/posta
    container_name: posta
    restart: unless-stopped
    env_file: /opt/nakama/posta/.env
    expose:
      - "8081"
