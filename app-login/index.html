<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Hextale — Sign in with Google</title>
<link rel="icon" href="/favicon.png">
<!--
  APP DESKTOP 1.0.2 — L'ACCESSO CON GOOGLE DELL'APP, NEL BROWSER VERO.

  Google rifiuta l'accesso dentro alle app ("Questo browser o questa app
  potrebbero non essere sicuri"): dall'app, "Login with Google" apre QUESTA
  pagina nel browser del giocatore, con due cose nell'indirizzo:
    porta  dove l'app aspetta, su questo computer (http://127.0.0.1:<porta>)
    stato  un numero a caso che l'app accetta una volta sola
  Qui si chiede il codice a Google col solito flusso del gioco (stesso client,
  stessa origine hextalegame.com, popup), e il codice si riporta all'app
  aprendo il suo indirizzo locale. Lo scambio col server lo fa poi il gioco,
  come sempre (vedi accessoGoogleCodice in play/index.html e desktop/main.js).
  Aperta senza porta e stato, la pagina dice solo di passare dall'app.
-->
<style>
@font-face{ font-family:'Marcellus SC'; src:url('/fonts/MarcellusSC-Regular.ttf') format('truetype'); font-display:swap; }
@font-face{ font-family:'Rosarivo'; src:url('/fonts/Rosarivo-Regular.ttf') format('truetype'); font-display:swap; }
html, body{ margin:0; min-height:100%; background:#101617; color:#EDE0C6; }
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; box-sizing:border-box; font-family:'Rosarivo', Georgia, serif; }
main{ width:100%; max-width:440px; text-align:center; background:#1B2325; border:1px solid rgba(233,222,197,0.25); border-radius:14px; padding:36px 28px; box-sizing:border-box; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
h1{ font-family:'Marcellus SC', Georgia, serif; font-weight:400; font-size:34px; margin:0 0 14px; }
p{ font-size:18px; line-height:1.45; margin:0 0 26px; color:#D9CDB4; }
button{ display:inline-flex; align-items:center; gap:12px; font:500 17px/1 system-ui, 'Segoe UI', sans-serif; color:#1f1f1f; background:#fff; border:1px solid #dadce0; border-radius:24px; padding:12px 24px; cursor:pointer; }
button:hover{ box-shadow:0 1px 6px rgba(0,0,0,0.35); }
button[disabled]{ opacity:0.6; cursor:default; }
button[hidden]{ display:none; }
</style>
</head>
<body>
<main>
  <h1>Hextale</h1>
  <p id="testo">Sign in with your Google account. When you're done, go back to the game.</p>
  <button id="google" type="button" hidden>
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continue with Google
  </button>
</main>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
  var GOOGLE_CLIENT_ID = '947017238895-crsaaks4v9lv08o16jsin68dr3a5s0qh.apps.googleusercontent.com';
  var q = new URLSearchParams(location.search);
  var porta = Number(q.get('porta'));
  var stato = q.get('stato') || '';
  var testo = document.getElementById('testo');
  var pulsante = document.getElementById('google');
  function scrivi(t){ testo.textContent = t; }
  if(!(Math.floor(porta) === porta && porta >= 1024 && porta <= 65535) || !/^[0-9a-f]{32}$/.test(stato)){
    scrivi('Open this page from the Hextale app: press "Login with Google" in the game.');
    return;
  }
  function tornaAllApp(parametri){
    location.replace('http://127.0.0.1:' + porta + '/google?stato=' + stato + '&' + parametri);
  }
  pulsante.hidden = false;
  pulsante.addEventListener('click', function(){
    if(!(window.google && google.accounts && google.accounts.oauth2)){
      scrivi('Google sign-in is still loading. Try again in a moment.');
      return;
    }
    var cliente = google.accounts.oauth2.initCodeClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'openid email profile',
      ux_mode: 'popup',
      callback: function(r){
        if(r && r.code){
          pulsante.disabled = true;
          scrivi('Signing you in...');
          tornaAllApp('code=' + encodeURIComponent(r.code));
        }else{
          tornaAllApp('errore=' + encodeURIComponent((r && r.error) || 'nessun codice'));
        }
      },
      error_callback: function(){
        scrivi('The Google window was closed. Press the button to try again.');
      }
    });
    cliente.requestCode();
  });
})();
</script>
</body>
</html>
